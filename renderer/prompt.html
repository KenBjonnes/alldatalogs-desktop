<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'">
<title>BigData</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #111114; color: #f4f4f6; font: 13px/1.4 system-ui, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; gap: 10px; padding: 16px 18px 14px; box-sizing: border-box; }
  label { color: #c8c8d0; font-weight: 600; }
  input { width: 100%; box-sizing: border-box; padding: 8px 10px; border-radius: 6px; border: 1px solid #33333b; background: #0d0d10; color: #f4f4f6; font: inherit; outline: none; }
  input:focus { border-color: #f5a623; box-shadow: 0 0 0 2px rgba(245,166,35,.25); }
  .row { display: flex; justify-content: flex-end; gap: 8px; margin-top: auto; }
  button { padding: 6px 16px; border-radius: 6px; border: 1px solid #33333b; background: #1a1a20; color: #f4f4f6; font: inherit; font-weight: 600; cursor: pointer; }
  button.primary { background: #f5a623; border-color: #f5a623; color: #111; }
  button:focus-visible { outline: 2px solid #f5a623; outline-offset: 1px; }
</style>
</head>
<body>
  <label id="msg" for="val">Name:</label>
  <input id="val" type="text" autocomplete="off" spellcheck="false">
  <div class="row">
    <button id="cancel" type="button">Cancel</button>
    <button id="ok" type="button" class="primary">OK</button>
  </div>
  <script src="/prompt.js"></script>
</body>
</html>
